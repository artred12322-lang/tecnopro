<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технопро — Админ-панель</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <i class="fas fa-shield-alt login-icon"></i>
            <h2>Вход в админ-панель</h2>
            <input type="password" id="passwordInput" placeholder="Пароль" autofocus>
            <button id="loginBtn" class="btn">Войти <i class="fas fa-arrow-right"></i></button>
            <div id="loginError" class="error"></div>
        </div>
    </div>

    <div class="admin-container" id="adminContainer" style="display: none;">
        <!-- Верхняя панель -->
        <header class="admin-header">
            <div class="header-left">
                <div class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </div>
                <h1><i class="fas fa-tools"></i> Технопро — Админ-панель</h1>
                <span class="version">v3.0</span>
            </div>
            <div class="header-right">
                <div class="notification-bell" id="notificationBell">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notificationBadge">0</span>
                </div>
                <button id="exportExcelBtn" class="export-btn"><i class="fas fa-file-excel"></i> Экспорт Excel</button>
                <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Выйти</button>
            </div>
        </header>

        <!-- ДАШБОРД (карточки + график) -->
        <div class="stats-grid">
            <div class="stat-card total"><i class="fas fa-inbox"></i><div class="stat-info"><div class="stat-value" id="totalCount">0</div><div class="stat-label">Всего заявок</div></div></div>
            <div class="stat-card new"><i class="fas fa-bell"></i><div class="stat-info"><div class="stat-value" id="newCount">0</div><div class="stat-label">Новых</div></div></div>
            <div class="stat-card work"><i class="fas fa-wrench"></i><div class="stat-info"><div class="stat-value" id="workCount">0</div><div class="stat-label">В работе</div></div></div>
            <div class="stat-card done"><i class="fas fa-check-circle"></i><div class="stat-info"><div class="stat-value" id="doneCount">0</div><div class="stat-label">Выполнено</div></div></div>
        </div>

        <!-- ГРАФИК -->
        <div class="chart-container">
            <div class="chart-header">
                <h3><i class="fas fa-chart-line"></i> Динамика заявок</h3>
                <select id="chartPeriod">
                    <option value="7">Последние 7 дней</option>
                    <option value="14">Последние 14 дней</option>
                    <option value="30" selected>Последние 30 дней</option>
                    <option value="90">Последние 90 дней</option>
                </select>
            </div>
            <canvas id="requestsChart" height="100"></canvas>
        </div>

        <!-- ФИЛЬТРЫ -->
        <div class="filters-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Поиск по имени, телефону, услуге, модели...">
            </div>
            <div class="date-filter">
                <i class="fas fa-calendar"></i>
                <input type="date" id="dateFrom" placeholder="С">
                <span>-</span>
                <input type="date" id="dateTo" placeholder="По">
            </div>
            <div class="type-filter">
                <i class="fas fa-filter"></i>
                <select id="typeFilter">
                    <option value="all">Все заявки</option>
                    <option value="repair">Ремонт</option>
                    <option value="business">Реклама / Бизнес</option>
                </select>
            </div>
            <div class="status-filter">
                <i class="fas fa-tag"></i>
                <select id="statusFilter">
                    <option value="all">Все статусы</option>
                    <option value="new">Новые</option>
                    <option value="work">В работе</option>
                    <option value="done">Выполнено</option>
                </select>
            </div>
            <button id="resetFiltersBtn" class="reset-btn"><i class="fas fa-undo"></i> Сбросить</button>
        </div>

        <!-- МАССОВЫЕ ДЕЙСТВИЯ -->
        <div class="bulk-actions" id="bulkActions" style="display: none;">
            <span>Выбрано: <strong id="selectedCount">0</strong></span>
            <button id="bulkDoneBtn" class="bulk-btn"><i class="fas fa-check-circle"></i> Отметить как выполнено</button>
            <button id="bulkDeleteBtn" class="bulk-btn delete"><i class="fas fa-trash"></i> Удалить</button>
            <button id="bulkCancelBtn" class="bulk-btn cancel">Отмена</button>
        </div>

        <!-- ТАБЛИЦА -->
        <div class="requests-table-container">
            <table class="requests-table" id="requestsTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAllCheckbox"></th>
                        <th class="sortable" data-sort="id">ID <i class="fas fa-sort"></i></th>
                        <th class="sortable" data-sort="date">Дата <i class="fas fa-sort"></i></th>
                        <th>Имя</th>
                        <th>Телефон</th>
                        <th>Модель</th>
                        <th>Услуга</th>
                        <th class="sortable" data-sort="status">Статус <i class="fas fa-sort"></i></th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="requestsBody">
                    <tr><td colspan="9" class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- ПАГИНАЦИЯ -->
        <div class="pagination" id="pagination">
            <button id="prevPage" disabled><i class="fas fa-chevron-left"></i> Назад</button>
            <span id="pageInfo">Страница 1 из 1</span>
            <button id="nextPage" disabled>Вперед <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <!-- МОДАЛКА КОММЕНТАРИЯ -->
    <div class="modal-comment" id="commentModal">
        <div class="modal-comment-content">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> Комментарий к заявке №<span id="commentRequestId"></span></h3>
                <button class="modal-close" id="closeCommentModal">&times;</button>
            </div>
            <textarea id="commentText" rows="4" placeholder="Введите комментарий мастера (будет виден только вам)..."></textarea>
            <div class="comment-history" id="commentHistory"></div>
            <div class="modal-buttons">
                <button id="saveCommentBtn" class="btn-save"><i class="fas fa-save"></i> Сохранить</button>
                <button id="cancelCommentBtn" class="btn-cancel">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ИСТОРИИ СТАТУСОВ -->
    <div class="modal-history" id="historyModal">
        <div class="modal-history-content">
            <div class="modal-header">
                <h3><i class="fas fa-history"></i> История изменений</h3>
                <button class="modal-close" id="closeHistoryModal">&times;</button>
            </div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <!-- ЗВУК УВЕДОМЛЕНИЯ (скрытый) -->
    <audio id="notificationSound" preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
    </audio>

    <script src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технопро — Админ-панель</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <i class="fas fa-shield-alt login-icon"></i>
            <h2>Вход в админ-панель</h2>
            <input type="password" id="loginPassword" placeholder="Пароль">
            <button id="loginBtn">Войти</button>
            <div id="loginError"></div>
        </div>
    </div>

    <div class="app" id="app" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">ТЕХНО<span>ПРО</span></div>
                <div class="subtitle">Админ-панель</div>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard"><i class="fas fa-chart-line"></i> Дашборд</a>
                <a href="#" class="nav-item" data-page="requests"><i class="fas fa-inbox"></i> Заявки <span class="badge" id="newBadge">0</span></a>
                <a href="#" class="nav-item" data-page="reviews"><i class="fas fa-star"></i> Отзывы</a>
                <a href="#" class="nav-item" data-page="moderation"><i class="fas fa-clock"></i> Модерация <span class="badge" id="modBadge">0</span></a>
                <a href="#" class="nav-item" data-page="services"><i class="fas fa-cogs"></i> Услуги</a>
                <a href="#" class="nav-item" data-page="photos"><i class="fas fa-images"></i> Фото</a>
                <a href="#" class="nav-item" data-page="settings"><i class="fas fa-sliders-h"></i> Настройки</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Выйти</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1 id="pageTitle">Дашборд</h1>
                <div class="top-bar-right">
                    <div class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></div>
                    <div><i class="fas fa-user-shield"></i> Админ</div>
                </div>
            </header>

            <div class="page-content">
                <!-- ДАШБОРД -->
                <div class="page active" id="dashboardPage">
                    <div class="stats">
                        <div class="stat-card"><i class="fas fa-inbox"></i><div><div class="stat-num" id="totalCount">0</div><div>Заявок</div></div></div>
                        <div class="stat-card"><i class="fas fa-bell"></i><div><div class="stat-num" id="newCount">0</div><div>Новых</div></div></div>
                        <div class="stat-card"><i class="fas fa-wrench"></i><div><div class="stat-num" id="workCount">0</div><div>В работе</div></div></div>
                        <div class="stat-card"><i class="fas fa-check-circle"></i><div><div class="stat-num" id="doneCount">0</div><div>Выполнено</div></div></div>
                    </div>
                    <div class="chart-card">
                        <canvas id="mainChart" height="100"></canvas>
                    </div>
                </div>

                <!-- ЗАЯВКИ -->
                <div class="page" id="requestsPage">
                    <div class="filters">
                        <input type="text" id="searchInput" placeholder="Поиск...">
                        <select id="typeFilter"><option value="all">Все</option><option value="repair">Ремонт</option><option value="business">Бизнес</option></select>
                        <select id="statusFilter"><option value="all">Все статусы</option><option value="new">Новые</option><option value="work">В работе</option><option value="done">Выполнено</option></select>
                        <button id="resetFilters" class="btn-secondary">Сбросить</button>
                    </div>
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead><tr><th>ID</th><th>Дата</th><th>Имя</th><th>Телефон</th><th>Услуга</th><th>Статус</th><th>Действия</th></tr></thead>
                            <tbody id="requestsBody"><tr><td colspan="7" class="text-center">Загрузка...</td></tr></tbody>
                        </table>
                    </div>
                    <div class="pagination"><button id="prevPage"><i class="fas fa-chevron-left"></i></button><span id="pageInfo">1</span><button id="nextPage"><i class="fas fa-chevron-right"></i></button></div>
                </div>

                <!-- ОТЗЫВЫ -->
                <div class="page" id="reviewsPage">
                    <div class="page-header"><h2>Одобренные отзывы</h2><button id="exportReviewsBtn" class="btn-primary">Экспорт CSV</button></div>
                    <div id="reviewsList"></div>
                </div>

                <!-- МОДЕРАЦИЯ -->
                <div class="page" id="moderationPage">
                    <div class="page-header"><h2>На модерации</h2></div>
                    <div id="moderationList"></div>
                </div>

                <!-- УСЛУГИ -->
                <div class="page" id="servicesPage">
                    <div class="page-header"><h2>Услуги</h2><button id="addServiceBtn" class="btn-primary">+ Добавить</button></div>
                    <div id="servicesList"></div>
                </div>

                <!-- ФОТО -->
                <div class="page" id="photosPage">
                    <div class="page-header"><h2>Фотогалерея</h2><button id="uploadPhotoBtn" class="btn-primary"><i class="fas fa-upload"></i> Загрузить</button></div>
                    <div id="photosList"></div>
                    <input type="file" id="photoInput" accept="image/*" style="display:none">
                </div>

                <!-- НАСТРОЙКИ -->
                <div class="page" id="settingsPage">
                    <div class="settings-card"><h3>Смена пароля</h3><input type="password" id="newPass" placeholder="Новый пароль"><input type="password" id="newPassConfirm" placeholder="Повторите"><button id="changePassBtn" class="btn-primary">Сохранить</button><div id="passMsg"></div></div>
                    <div class="settings-card"><h3>Данные</h3><button id="exportDataBtn" class="btn-secondary">Экспорт JSON</button><button id="clearDataBtn" class="btn-danger">Очистить всё</button></div>
                </div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
